<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地 PDF 阅读器模拟</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 10px;
        background: #4a4a4a;
        color: #fff;
        font: 12px/1.5 sans-serif;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
      }
      button {
        padding: 7px;
        border: 0;
        border-radius: 5px;
        background: #fff;
        color: #444;
      }
      .zooms {
        display: flex;
        gap: 4px;
        margin-top: 7px;
      }
      #pdf-viewport {
        height: 210px;
        margin-top: 8px;
        overflow: auto;
        background: #777;
      }
      #pdf-page {
        width: 92%;
        min-height: 280px;
        margin: 10px auto;
        padding: 22px;
        transform-origin: top center;
        background: #fff;
        color: #333;
        box-shadow: 0 2px 10px #0005;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="pdf-prev" type="button">上一页</button>
      <strong id="pdf-status">第 1 / 3 页 · 100%</strong>
      <button id="pdf-next" type="button">下一页</button>
    </div>
    <div class="zooms" aria-label="PDF 缩放">
      <button type="button" data-pdf-zoom="100">100%</button>
      <button type="button" data-pdf-zoom="125">125%</button>
      <button type="button" data-pdf-zoom="150">150%</button>
    </div>
    <div id="pdf-viewport"><article id="pdf-page"></article></div>
    <script>
      (() => {
        const pages = [
          ['模拟保险合同', '第一页用于验证阅读器首次加载、滚动和页面快照。'],
          ['保障责任摘要', '第二页用于验证翻页后的 DOM 替换、页码和缩放状态。'],
          ['责任免除摘要', '第三页用于验证连续翻页与返回操作。'],
        ];
        let pageIndex = 0;
        let zoom = 100;
        const page = document.querySelector('#pdf-page');
        const viewport = document.querySelector('#pdf-viewport');
        const render = () => {
          page.replaceChildren();
          const title = document.createElement('h2');
          const copy = document.createElement('p');
          title.textContent = pages[pageIndex][0];
          copy.textContent = pages[pageIndex][1];
          page.append(title, copy);
          page.style.transform = `scale(${zoom / 100})`;
          document.querySelector('#pdf-status').textContent = `第 ${
            pageIndex + 1
          } / ${pages.length} 页 · ${zoom}%`;
          viewport.scrollTop = 0;
        };
        document.querySelector('#pdf-prev').addEventListener('click', () => {
          pageIndex = Math.max(0, pageIndex - 1);
          render();
        });
        document.querySelector('#pdf-next').addEventListener('click', () => {
          pageIndex = Math.min(pages.length - 1, pageIndex + 1);
          render();
        });
        document.querySelectorAll('[data-pdf-zoom]').forEach((button) => {
          button.addEventListener('click', () => {
            zoom = Number(button.dataset.pdfZoom);
            render();
          });
        });
        render();
      })();
    </script>
  </body>
</html>
