<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataInsights 本地保险回放</title>
    <link rel="stylesheet" href="/player/style.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: clamp(16px, 4vw, 40px);
        color: #17324d;
        background: #eef3f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(100%, 470px);
        margin: 0 auto 16px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      #status {
        color: #60798b;
      }
      #replay-root {
        width: fit-content;
        max-width: 100%;
        margin: 0 auto;
        overflow-x: auto;
        border-radius: 14px;
        background: white;
        box-shadow: 0 8px 30px #14354b18;
      }
      #replay-root .rr-player {
        overflow: hidden;
        border-radius: 14px;
      }
      @media (max-width: 520px) {
        body {
          padding-inline: 8px;
        }
        header {
          padding-inline: 8px;
        }
      }
    </style>
    <script src="/player/rrweb-player.js"></script>
  </head>
  <body>
    <header>
      <h1>本地保险投保回放</h1>
      <span id="status">正在加载…</span>
    </header>
    <div id="replay-root"></div>
    <script>
      window.__REPLAY_READY__ = false;
      window.__REPLAY_FINISHED__ = false;
      window.__REPLAY_SCRIPT_EXECUTED__ = false;

      async function startReplay() {
        const recordingId = decodeURIComponent(
          location.pathname.split('/').pop(),
        );
        const recordings = await fetch('/recordings').then((response) =>
          response.json(),
        );
        const recording = recordings.find(
          (item) => item.recordingId === recordingId,
        );
        if (!recording) throw new Error('Recording not found.');
        const events = recording.batches
          .slice()
          .sort((left, right) => left.sequenceStart - right.sequenceStart)
          .flatMap((batch) => batch.events);
        if (!events.length) throw new Error('Recording has no replay events.');
        const metaEvent = events.find((event) => event.type === 4);
        const recordedWidth = Number(metaEvent?.data?.width) || 390;
        const recordedHeight = Number(metaEvent?.data?.height) || 844;
        const availableWidth = Math.max(
          280,
          Math.min(recordedWidth, window.innerWidth - 32),
        );
        const scale = Math.min(1, availableWidth / recordedWidth);
        const Player = rrwebPlayer.default ?? rrwebPlayer.Player ?? rrwebPlayer;
        const player = new Player({
          target: document.querySelector('#replay-root'),
          props: {
            events,
            width: Math.round(recordedWidth * scale),
            height: Math.round(recordedHeight * scale),
            autoPlay: false,
            showController: true,
            skipInactive: true,
            speed: 1,
            speedOption: [1, 2, 4, 8],
            showWarning: false,
            showDebug: false,
          },
        });
        window.__REPLAY_PLAYER__ = player;
        await new Promise((resolve) => requestAnimationFrame(resolve));
        const replayer = player.getReplayer();
        if (!replayer) throw new Error('Replay player did not initialize.');
        replayer.on('start', () => {
          document.querySelector('#status').textContent = '正在回放';
        });
        replayer.on('pause', () => {
          document.querySelector('#status').textContent = '已暂停';
        });
        replayer.on('finish', () => {
          window.__REPLAY_FINISHED__ = true;
          document.querySelector('#status').textContent = '回放完成';
        });
        window.__REPLAY_READY__ = true;
        document.querySelector('#status').textContent = '已就绪';
      }

      startReplay().catch((error) => {
        window.__REPLAY_ERROR__ = String(error);
        document.querySelector('#status').textContent = '回放失败';
      });
    </script>
  </body>
</html>
